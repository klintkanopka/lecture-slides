packages:
  - slides/**
  - themes/*
  - addons/*

allowBuilds:
  esbuild: true
  playwright-chromium: true
  vue-demi: true
catalog:
  '@slidev/cli': ^52.12.0
  '@slidev/theme-default': ^0.25.0
  '@slidev/theme-seriph': ^0.25.0
  slidev-theme-dracula: ^0.2.0
  vue: ^3.5.29

permissions:
  '@slidev/cli':
    skills: true
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .github/skills
